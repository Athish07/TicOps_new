# JWT
app.jwt.secret=TicOps2026SuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Email Polling ────────────────────────────────────────────────────
# Set to true to enable IMAP email polling (auto-ingests emails for ticket conversion)
app.email.polling.enabled=false
# Polling interval in milliseconds (default: 60 seconds)
app.email.polling.interval-ms=60000

# ── Power Automate Webhook Ingest (RECOMMENDED — no admin access needed) ──
# Power Automate pushes emails to POST /api/v1/email/ingest with this key
# Set this to a strong random secret and configure the same in your Power Automate flow
app.email.ingest.api-key=TicOps-PA-Ingest-2026-SecretKey

# ── IMAP (alternative — for Gmail/Yahoo/personal accounts) ──────────
# imap.gmail.com / outlook.office365.com
app.email.imap.host=imap.gmail.com
app.email.imap.port=993
app.email.imap.username=your-email@gmail.com
app.email.imap.password=your-app-password
app.email.imap.folder=INBOX

# Logging
logging.level.com.ticops=DEBUG
logging.level.org.springframework.security=WARN
